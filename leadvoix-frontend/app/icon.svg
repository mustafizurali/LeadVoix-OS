<svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fav-bg" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A233D" />
      <stop offset="100%" stop-color="#080C18" />
    </linearGradient>
    <linearGradient id="fav-wave" x1="4" y1="6" x2="32" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7657F6" />
      <stop offset="50%" stop-color="#9B7DFE" />
      <stop offset="100%" stop-color="#24C8D8" />
    </linearGradient>
    <linearGradient id="fav-pulse" x1="16" y1="16" x2="20" y2="31" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#24C8D8" />
      <stop offset="100%" stop-color="#35D6C1" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="36" height="36" rx="8" fill="url(#fav-bg)" stroke="#7657F6" stroke-opacity="0.3" stroke-width="1"/>

  <!-- V-shaped Voice Waveform -->
  <rect x="4.5" y="7" width="3.5" height="17" rx="1.75" fill="url(#fav-wave)"/>
  <rect x="10.5" y="11.5" width="3.5" height="15" rx="1.75" fill="url(#fav-wave)"/>
  <rect x="16.25" y="16" width="3.5" height="14" rx="1.75" fill="url(#fav-pulse)"/>
  <rect x="22" y="11.5" width="3.5" height="15" rx="1.75" fill="url(#fav-wave)"/>
  <rect x="28" y="7" width="3.5" height="17" rx="1.75" fill="url(#fav-wave)"/>
</svg>
