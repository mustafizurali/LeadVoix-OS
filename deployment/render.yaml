services:
  # LeadVoix OS Web API Service (Serves Twilio Webhooks & Frontend API)
  - type: web
    name: leadvoix-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.15
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: BACKEND_BASE_URL
        sync: false

  # LeadVoix OS Persistent Background Worker Service
  - type: worker
    name: leadvoix-call-worker
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m backend.app.workers.call_worker
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.15
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: BACKEND_BASE_URL
        sync: false
      - key: WORKER_POLL_INTERVAL_SECONDS
        value: "5.0"

  # LeadVoix Business JARVIS 24/7 Autonomous Background Worker Service
  - type: worker
    name: leadvoix-jarvis-worker
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m backend.app.workers.jarvis_worker process
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.15
      - key: ENABLE_JARVIS
        value: "false"
      - key: JARVIS_DATABASE_URL
        sync: false
      - key: JARVIS_OPERATIONAL_DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: JARVIS_INTERNAL_ORG_ID
        value: "1"
      - key: JARVIS_KILL_SWITCH
        value: "false"
      - key: JARVIS_TIMEZONE
        value: Asia/Kolkata
      - key: JARVIS_POLL_INTERVAL_SECONDS
        value: "5.0"
      - key: JARVIS_HEARTBEAT_INTERVAL_SECONDS
        value: "30.0"
